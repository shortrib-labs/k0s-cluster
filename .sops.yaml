creation_rules:
- path: secrets/params.yaml
  encrypted_regex: '^(.*password|api.key|client.secret)$'
  pgp: >-
    905EBD494A6AA2B774ED5C67621620CDA290611D!,
    29451B3218DDD551B34905DF88C11C4B40CA0A07!,
    A2164C4257BB2EBFA51F26E948A64E8333B82F50!
- path: base/capv-system
  encrypted_regex: '^(VSPHERE_USERNAME|VSPHERE_PASSWORD)$'
  pgp: >-
    905EBD494A6AA2B774ED5C67621620CDA290611D!,
    29451B3218DDD551B34905DF88C11C4B40CA0A07!,
    A2164C4257BB2EBFA51F26E948A64E8333B82F50!
- encrypted_regex: '^(data|stringData)$'
  # Base is shared, you can add keys from each environment that uses base here
  pgp: >-
    905EBD494A6AA2B774ED5C67621620CDA290611D!,
    29451B3218DDD551B34905DF88C11C4B40CA0A07!,
    A2164C4257BB2EBFA51F26E948A64E8333B82F50!
