#@data/values
---
hostname: node
domain: lab.shortrib.net # replace with your domain

cluster_image_name: ubuntu-25.04-server-cloudimg-amd64.img

default_password: REDACTED # password for the default `ubuntu` user

ssh:
  authorized_keys:
  - REDACTED  # your SSH public key

cluster:
  controllers: 1
  workers: 2
  mode: vm                                 # vm | k0smotron — see README §Cluster Modes
  version: 1.35.2+k0s.0                    # k0s version (applies to both modes; no leading `v` — k0sctl rejects it)
  # k0smotron mode configuration (ignored when mode: vm) — see README §k0smotron Mode Prerequisites
  # k0smotron:
  #   management_kubeconfig: /path/to/mgmt-kubeconfig  # kubeconfig for the management cluster hosting the control plane
  #   namespace: clusters                              # namespace on the management cluster where this cluster's CRs live
  #   external_ip: 10.26.0.100                         # pre-reserved MetalLB IP for the hosted API LoadBalancer

users:
    - default
    - name: REDACTED   # your preferred user name
      gecos: REDACETD  # your real name
      groups:
        - users
        - adm
        - sudo
        - ssher
      ssh_import_id:
        - gh:REDACTED   # your github username, assuming you use SSH with it
      sudo: ALL=(ALL) NOPASSWD:ALL
      lock_passwd: true

node:
  cpus: 4          # this is the minimum to pass the host check
  memory: 8192     # this is the minimum to pass the host check
  disk_size: 52    # this ist he minimum to pass the host check for Longhorn

# Nutanix Infrastructure Configuration
# Replace with your actual Nutanix environment details
nutanix:
  prism_central: prism.lab.shortrib.net  # Prism Central IP or FQDN
  username: admin                         # Prism Central username
  password: REDACTED                      # Will be SOPS-encrypted
  cluster: homelab                        # Nutanix cluster name
  storage_container: kubernetes           # Storage container for VMs
  files:
    server: fileserver                    # Nutanix Files server name (as registered in Prism)
    fqdn: fileserver.domain.com           # Nutanix Files server FQDN (for REST API auth)
    username: node                        # Files server REST API user - use cluster name (create via Prism > File Server > Manage roles)
    password: REDACTED                    # Files server REST API password
  subnets:
    kubernetes: Kubernetes                # Management network subnet
    workload: Workload                    # Workload network subnet

# MAC addresses for control plane nodes (for DHCP reservations)
# Number of MACs must match cluster.controllers count
control_plane_mac:
  - "50:6b:8d:00:00:01"  # First control plane node - configure DHCP reservation
  # - "50:6b:8d:00:00:02"  # Second control plane node (if controllers: 2)
  # - "50:6b:8d:00:00:03"  # Third control plane node (if controllers: 3)

# ACME / Let's Encrypt configuration. Cloudflare API token is used by
# cert-manager's DNS-01 challenge for the letsencrypt ClusterIssuer.
# Mint at https://dash.cloudflare.com/profile/api-tokens with Zone:DNS:Edit
# scope on the served zones.
acme:
  cloudflare:
    api_key: REDACTED                     # encrypted automatically (matches encrypted_regex)
